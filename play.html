<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Маяк — дело</title>
  <meta name="description" content="Браузерный триллер-квест: улики ищутся в интернете персонажей.">
  <meta name="theme-color" content="#0b0c0e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0c0e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23c8102e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/access.css">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="topbar">
    <a class="back" href="index.html" title="Все эпизоды сезона">← Сезон</a>
    <div class="brand"><span class="rec"></span> <span id="case-title">МАЯК</span></div>
    <div class="agent" id="agent-label"></div>
    <nav class="top-actions">
      <button class="ghost" id="btn-evidence" type="button">Улики <span class="count" id="evidence-count">0</span></button>
      <button class="ghost" id="btn-reset" type="button" title="Начать эпизод заново">⟲</button>
    </nav>
  </header>

  <main id="app" class="app">
    <section class="screen loading"><div class="stamp">ЗАГРУЗКА</div><p class="lead">Открываем папку с делом…</p></section>
  </main>

  <aside id="evidence-panel" class="panel" aria-hidden="true">
    <div class="panel-head">
      <h2>Доска улик</h2>
      <button class="ghost" id="btn-close-evidence" type="button" aria-label="Закрыть">✕</button>
    </div>
    <div id="evidence-list" class="evidence-list"></div>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/core/answers.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/vault.js"></script>
  <script src="js/platform/catalog.js"></script>
  <script src="js/platform/access.js"></script>
  <script src="js/engine/game.js"></script>
</body>
</html>
