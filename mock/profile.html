<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Профиль</title>
  <style>
    :root { --bg:#fafafa; --card:#fff; --text:#111; --muted:#737373; --line:#dbdbdb; --accent:#0a66c2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#121212; --text:#f5f5f5; --muted:#a8a8a8; --line:#262626; --accent:#4cb5f9; } }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .demo { background:#ffd166; color:#222; font-size:12px; text-align:center; padding:6px 12px; }
    .wrap { max-width:935px; margin:0 auto; padding:28px 16px 60px; }
    header { display:flex; gap:28px; align-items:center; padding-bottom:28px; border-bottom:1px solid var(--line); }
    .ava { flex:none; width:120px; height:120px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:38px; font-weight:600; box-shadow:0 0 0 3px var(--bg), 0 0 0 5px var(--line); }
    .uname { font-size:20px; margin:0 0 10px; }
    .stats { display:flex; gap:24px; margin-bottom:10px; font-size:14px; }
    .stats b { font-weight:600; }
    .fullname { font-weight:600; }
    .bio { white-space:pre-line; }
    .bio a { color:var(--accent); text-decoration:none; font-weight:600; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-top:20px; }
    .tile { aspect-ratio:1; border:0; padding:0; cursor:pointer; position:relative; overflow:hidden; }
    .tile:hover::after { content:""; position:absolute; inset:0; background:rgba(0,0,0,.25); }
    .scene { position:relative; width:100%; height:100%; display:grid; place-items:center; overflow:hidden; }
    .scene .em { font-size:clamp(40px,10vw,90px); filter:drop-shadow(0 6px 10px rgba(0,0,0,.4)); }
    .scene .txt { position:absolute; bottom:10%; left:0; right:0; text-align:center; color:#fff; font:700 clamp(14px,3vw,26px)/1.1 Georgia, serif; letter-spacing:.08em; text-shadow:0 2px 8px rgba(0,0,0,.7); }
    .scene.big .em { font-size:120px; }
    /* Чек: в превью мелкий, в открытом посте читаемый */
    .receipt { position:absolute; right:7%; bottom:-4%; width:46%; background:#f6f3ea; color:#222; padding:6% 5%; font:9px/1.35 "Courier New", monospace; transform:rotate(-7deg); box-shadow:0 6px 18px rgba(0,0,0,.55); }
    .receipt::after { content:""; position:absolute; left:0; right:0; bottom:-6px; height:6px; background:linear-gradient(-45deg,transparent 4px,#f6f3ea 0) 0 0/8px 8px, linear-gradient(45deg,transparent 4px,#f6f3ea 0) 0 0/8px 8px; }
    .scene:not(.big) .receipt { font-size:3px; }
    .receipt .t { text-align:center; font-weight:700; font-size:1.25em; }
    .receipt .c { text-align:center; }
    .receipt .row { display:flex; justify-content:space-between; gap:6px; }
    .receipt hr { border:0; border-top:1px dashed #555; margin:.6em 0; }
    .scene .em.side { position:absolute; left:14%; top:22%; }
    /* Шарф: инициалы мелко, видны только в открытом посте */
    .scarf { position:absolute; inset:18% 10%; background:repeating-linear-gradient(90deg,#c1121f 0 10px,#a00d19 10px 12px); border-radius:40% 30% 45% 35%; transform:rotate(-12deg); box-shadow:0 10px 25px rgba(0,0,0,.6); }
    .scarf .ini { position:absolute; right:14%; bottom:16%; color:#ffd6a5; font:italic 700 13px Georgia, serif; opacity:.85; transform:rotate(8deg); }
    .scene:not(.big) .scarf .ini { font-size:4px; }
    /* Модальное окно поста */
    dialog { border:0; padding:0; max-width:min(980px,96vw); width:100%; background:var(--card); color:var(--text); }
    dialog::backdrop { background:rgba(0,0,0,.75); }
    .post { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); }
    .post .photo { aspect-ratio:1; overflow:hidden; }
    .post .side { display:flex; flex-direction:column; border-left:1px solid var(--line); max-height:min(80vh,600px); }
    .post .head { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); }
    .mini { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:12px; font-weight:600; flex:none; }
    .post .body { padding:12px 14px; overflow-y:auto; flex:1; }
    .post .body p { margin:0 0 12px; }
    .post .date { color:var(--muted); font-size:12px; padding:10px 14px; border-top:1px solid var(--line); }
    .u { font-weight:600; color:var(--text); text-decoration:none; }
    a.u:hover { text-decoration:underline; }
    .close { position:fixed; top:12px; right:16px; background:none; border:0; color:#fff; font-size:30px; cursor:pointer; }
    .zoom-hint { color:var(--muted); font-size:12px; text-align:center; padding:6px; }
    .photo { cursor:zoom-in; }
    .photo.zoomed { cursor:zoom-out; }
    .photo.zoomed .scene { transform:scale(2); transform-origin:var(--zx,70%) var(--zy,80%); }
    .scene { transition:transform .3s; }
    .notfound { text-align:center; padding:80px 0; color:var(--muted); }
    @media (max-width:640px) {
      header { gap:16px; } .ava { width:78px; height:78px; font-size:26px; }
      .stats { gap:14px; font-size:13px; }
      .post { grid-template-columns:1fr; } .post .side { border-left:0; max-height:none; }
    }
  </style>
</head>
<body>
  <div class="demo">Демо-профиль вымышленного персонажа. В полной версии игры здесь будет ссылка на настоящий аккаунт в соцсети.</div>
  <div class="wrap" id="root"></div>

  <dialog id="post">
    <button class="close" id="close" aria-label="Закрыть">×</button>
    <div class="post">
      <div class="photo" id="post-photo"></div>
      <div class="side">
        <div class="head" id="post-head"></div>
        <div class="body" id="post-body"></div>
        <div class="date" id="post-date"></div>
      </div>
    </div>
  </dialog>

  <script src="profiles.js"></script>
  <script>
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const user = new URLSearchParams(location.search).get("u") || "";
    const p = PROFILES[user];
    const root = document.getElementById("root");

    function userLink(u) {
      return PROFILES[u] ? `<a class="u" href="?u=${encodeURIComponent(u)}">${esc(u)}</a>` : `<span class="u">${esc(u)}</span>`;
    }
    function mini(u) {
      const q = PROFILES[u];
      return `<span class="mini" style="background:${q ? q.color : "#888"}">${esc(q ? q.avatar : u[0].toUpperCase())}</span>`;
    }
    function sceneHtml(s, big) {
      let inner = "";
      if (s.emoji) inner += `<div class="em ${s.receipt ? "side" : ""}">${s.emoji}</div>`;
      if (s.text) inner += `<div class="txt">${esc(s.text)}</div>`;
      if (s.scarf) inner += `<div class="scarf"><span class="ini">${esc(s.scarf)}</span></div>`;
      if (s.receipt) {
        const r = s.receipt;
        inner += `<div class="receipt">
          <div class="t">${esc(r.title)}</div><div class="c">${esc(r.sub)}</div><hr>
          ${r.meta.map((m) => `<div>${esc(m)}</div>`).join("")}<hr>
          ${r.items.map(([a, b]) => `<div class="row"><span>${esc(a)}</span><span>${esc(b)}</span></div>`).join("")}<hr>
          <div class="row"><b>ИТОГО</b><b>${esc(r.total)}</b></div>
          <div>${esc(r.pay)}</div><div class="c">СПАСИБО!</div></div>`;
      }
      return `<div class="scene ${big ? "big" : ""}" style="background:${s.bg}">${inner}</div>`;
    }

    if (!p) {
      document.title = "Профиль не найден";
      root.innerHTML = `<div class="notfound"><h2>Такой страницы нет</h2><p>Возможно, ссылка неверна или аккаунт удалён.</p></div>`;
    } else {
      document.title = `${p.name} (@${user})`;
      root.innerHTML = `
        <header>
          <div class="ava" style="background:${p.color}">${esc(p.avatar)}</div>
          <div>
            <h1 class="uname">${esc(user)}</h1>
            <div class="stats"><span><b>${p.posts.length}</b> публикаций</span><span><b>${p.followers}</b> подписчиков</span><span><b>${p.following}</b> подписок</span></div>
            <div class="fullname">${esc(p.name)}</div>
            <div class="bio">${esc(p.bio)}</div>
            ${p.link ? `<div class="bio"><a href="${esc(p.link.url)}" target="_blank" rel="noopener">🔗 ${esc(p.link.label)}</a></div>` : ""}
          </div>
        </header>
        <div class="grid">${p.posts.map((post, i) => `<button class="tile" data-i="${i}" aria-label="Публикация от ${esc(post.date)}">${sceneHtml(post.scene, false)}</button>`).join("")}</div>`;

      const dlg = document.getElementById("post");
      const photo = document.getElementById("post-photo");
      root.querySelectorAll(".tile").forEach((t) => t.addEventListener("click", () => {
        const post = p.posts[+t.dataset.i];
        photo.className = "photo";
        photo.innerHTML = sceneHtml(post.scene, true);
        document.getElementById("post-head").innerHTML = `${mini(user)} ${userLink(user)}`;
        document.getElementById("post-body").innerHTML =
          `<p>${userLink(user)} ${esc(post.caption)}</p>` +
          post.comments.map(([u, c]) => `<p>${userLink(u)} ${esc(c)}</p>`).join("");
        document.getElementById("post-date").textContent = post.date;
        dlg.showModal();
      }));
      photo.addEventListener("click", (e) => {
        const r = photo.getBoundingClientRect();
        photo.style.setProperty("--zx", ((e.clientX - r.left) / r.width * 100) + "%");
        photo.style.setProperty("--zy", ((e.clientY - r.top) / r.height * 100) + "%");
        photo.classList.toggle("zoomed");
      });
      document.getElementById("close").addEventListener("click", () => dlg.close());
      dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
    }
  </script>
</body>
</html>
