<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Хэш ответа</title>
  <style>
    body { font:15px/1.5 system-ui, sans-serif; max-width:640px; margin:40px auto; padding:0 16px; }
    input { width:100%; font:inherit; padding:8px; margin:4px 0 12px; box-sizing:border-box; }
    code { display:block; background:#f2f2f2; padding:10px; word-break:break-all; }
  </style>
</head>
<body>
  <h1>Хэш ответа для case.js</h1>
  <label>Соль (CASE.salt) <input id="salt"></label>
  <label>Ответ <input id="ans" placeholder="Северный ветер"></label>
  <p>Нормализованный ответ: <b id="norm"></b></p>
  <code id="out">—</code>
  <script src="../js/answers.js"></script>
  <script src="../js/case.js"></script>
  <script>
    const salt = document.getElementById("salt"), ans = document.getElementById("ans");
    salt.value = CASE.salt;
    async function upd() {
      document.getElementById("norm").textContent = Answers.normalize(ans.value);
      document.getElementById("out").textContent = ans.value ? await Answers.hashAnswer(salt.value, ans.value) : "—";
    }
    salt.oninput = ans.oninput = upd;
  </script>
</body>
</html>
